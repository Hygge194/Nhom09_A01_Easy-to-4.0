<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Mentor Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-lg bg-white rounded-[40px] border border-slate-200 shadow-2xl p-10">
        <div class="text-center mb-8">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-3xl bg-blue-600 text-white shadow-xl shadow-blue-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                </svg>
            </div>
            <h1 class="mt-6 text-3xl font-black text-slate-900">Tham gia ngay</h1>
            <p class="mt-2 text-sm text-slate-500">Bắt đầu hành trình kết nối tri thức cùng Mentor Platform.</p>
        </div>

        <form id="registerForm" class="space-y-6">
            <div>
                <label for="reg-name" class="block text-sm font-semibold text-slate-700 mb-2">Họ và tên</label>
                <input type="text" id="reg-name" placeholder="Họ và tên của bạn" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition" required />
            </div>

            <div>
                <label for="reg-email" class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
                <input type="email" id="reg-email" placeholder="Địa chỉ Email" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition" required />
            </div>

            <div>
                <label for="reg-password" class="block text-sm font-semibold text-slate-700 mb-2">Mật khẩu</label>
                <input type="password" id="reg-password" placeholder="Mật khẩu (ít nhất 6 ký tự)" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition" required />
            </div>

            <button type="submit" id="register-btn" class="w-full rounded-2xl bg-blue-600 py-3 text-sm font-semibold uppercase tracking-[0.12em] text-white shadow-lg shadow-blue-500/10 hover:bg-blue-700 transition">Đăng ký tài khoản</button>

            <p class="text-center text-sm text-slate-500">Đã có tài khoản? <a href="login.html" class="font-semibold text-blue-600 hover:text-blue-700">Đăng nhập tại đây</a></p>
        </form>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            handleRegister();
        });
    </script>
</body>
</html>
