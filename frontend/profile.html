<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa hồ sơ - Mentor Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">
    
    <!-- Navbar -->
    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center border-b border-gray-100">
        <a href="index.html" class="text-2xl font-black text-blue-700 tracking-tighter">MENTOR<span class="text-amber-500">.</span></a>
        <div>
            <button onclick="window.history.back()" class="text-gray-500 hover:text-blue-600 font-semibold transition">
                <i class="fas fa-arrow-left mr-2"></i> Quay lại
            </button>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto mt-10 p-8 bg-white rounded-3xl shadow-xl border border-gray-100 mb-20">
        <h1 class="text-3xl font-black text-gray-800 mb-8 text-center">Hồ Sơ Cá Nhân</h1>
        
        <form id="profile-form" enctype="multipart/form-data" class="space-y-6">
            
            <!-- Avatar Section -->
            <div class="flex flex-col items-center mb-8">
                <div class="relative">
                    <img id="profile-avatar-preview" src="https://via.placeholder.com/150" alt="Avatar" class="w-36 h-36 rounded-full object-cover border-4 border-white shadow-lg ring-4 ring-blue-50 bg-gray-100">
                    <label for="avatar" class="absolute bottom-1 right-1 bg-blue-600 text-white p-2.5 rounded-full cursor-pointer hover:bg-blue-700 transition shadow-md">
                        <i class="fas fa-camera"></i>
                    </label>
                    <input type="file" id="avatar" name="avatar" accept="image/*" class="hidden" onchange="previewImage(event)">
                </div>
                <p class="text-sm text-gray-500 mt-4 italic">Nhấp vào biểu tượng máy ảnh để tải lên ảnh mới</p>
            </div>

            <!-- General Info -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Họ và tên</label>
                    <input type="text" id="profile-fullname" name="full_name" class="w-full p-4 rounded-xl border-2 border-gray-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition font-medium" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Email</label>
                    <input type="email" id="profile-email" class="w-full p-4 rounded-xl border-2 border-gray-200 bg-gray-100 text-gray-500 outline-none font-medium cursor-not-allowed" readonly title="Email không thể thay đổi">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Số điện thoại</label>
                    <input type="tel" id="profile-phone" name="phone" class="w-full p-4 rounded-xl border-2 border-gray-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition font-medium" >
                </div>
            </div>
            <!-- Mentor Specific Fields (Ẩn đối với Student) -->
            <div id="mentor-specific-fields" class="hidden space-y-6 border-t-2 border-dashed border-gray-100 pt-8 mt-8">
                <h2 class="text-xl font-black text-blue-800 flex items-center">
                    <i class="fas fa-chalkboard-teacher mr-3 text-blue-500"></i> Thông tin Giảng viên (Mentor)
                </h2>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Lĩnh vực chuyên môn (Expertise)</label>
                    <input type="text" id="profile-expertise" name="expertise" class="w-full p-4 rounded-xl border-2 border-gray-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition font-medium text-blue-700" placeholder="VD: Frontend Development, Data Analyst...">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Giới thiệu tiểu sử (Bio)</label>
                    <textarea id="profile-bio" name="bio" rows="4" class="w-full p-4 rounded-xl border-2 border-gray-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition font-medium text-gray-700" placeholder="Hãy kể về kinh nghiệm, nơi làm việc và phong cách giảng dạy của bạn..."></textarea>
                </div>
            </div>

            <div class="pt-8 border-t-2 border-dashed border-gray-100 mt-8">
                <button type="submit" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg hover:bg-blue-700 hover:shadow-blue-500/30 transition-all active:scale-95 flex justify-center items-center text-lg">
                    <i class="fas fa-save mr-3"></i> LƯU THÔNG TIN
                </button>
            </div>
        </form>
    </main>

    <script>
        // Xem trước ảnh trực tiếp trên trình duyệt khi người dùng chọn file
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('profile-avatar-preview');
                output.src = reader.result;
            }
            if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
        }
    </script>
    <script src="js/profile.js"></script>
</body>
</html>
