<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Mentor Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-lg bg-white rounded-[40px] border border-slate-200 shadow-2xl p-10">
        <div class="text-center mb-8">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-3xl bg-blue-600 text-white shadow-xl shadow-blue-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                </svg>
            </div>
            <h1 class="mt-6 text-3xl font-black text-slate-900">Đăng nhập</h1>
            <p class="mt-2 text-sm text-slate-500">Vui lòng đăng nhập để tiếp tục với Mentor Platform.</p>
        </div>
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2" for="email">Email</label>
                <input type="email" id="email" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition" required>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2" for="password">Mật khẩu</label>
                <input type="password" id="password" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition" required>
            </div>
            <button type="submit" class="w-full rounded-2xl bg-blue-600 py-3 text-sm font-semibold uppercase tracking-[0.12em] text-white shadow-lg shadow-blue-500/10 hover:bg-blue-700 transition">Vào hệ thống</button>
        </form>
        <p class="mt-6 text-center text-sm text-slate-500">Chưa có tài khoản? <a href="register.html" class="font-semibold text-blue-600 hover:text-blue-700">Đăng ký ngay</a></p>
    </div>

    <script src="js/auth.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const result = await login(email, password);
            if (result.token) {
                // Điều hướng dựa trên Role
                if (result.user.role === 'mentor') {
                    window.location.href = 'dashboard-mentor.html';
                } else {
                    window.location.href = 'mentors.html';
                }
            } else {
                alert(result.message || 'Sai thông tin đăng nhập');
            }
        });

        ['email', 'password'].forEach((fieldId) => {
            const field = document.getElementById(fieldId);
            field.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    loginForm.requestSubmit();
                }
            });
        });
    </script>
</body>
</html>
